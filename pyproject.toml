[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olyder"
version = "0.5.0b1"
description = "Verification-driven execution, independent checks, and evidence for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Olyder Contributors"}]
keywords = ["ai-agents", "testing", "verification", "mcp", "coding-agents", "agent-skills"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/Ratnadeep-2007/Olyder"
Repository = "https://github.com/Ratnadeep-2007/Olyder"
Issues = "https://github.com/Ratnadeep-2007/Olyder/issues"
Documentation = "https://github.com/Ratnadeep-2007/Olyder/blob/main/docs/UNIVERSAL_GUIDE.md"
Changelog = "https://github.com/Ratnadeep-2007/Olyder/blob/main/CHANGELOG.md"

[project.optional-dependencies]
browser = ["playwright>=1.50"]
acp = ["agent-client-protocol>=0.12,<0.13"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
olyder = "olyder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
olyder = ["data/SKILL.md"]
