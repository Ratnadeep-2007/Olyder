name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: CLI help
        run: olyder --help
  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Pull minimal test image
        run: docker pull python:3.13-slim
      - name: Real read-only mount and no-network sandbox tests
        env:
          OLYDER_LIVE_DOCKER: '1'
        run: python -m pytest -q tests/test_docker_live.py

  acp-interop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ACP optional integration
        run: python -m pip install -e '.[acp]' pytest
      - name: Independent SDK/stdio contract tests
        run: python -m pytest -q tests/test_acp_bridge.py
      - name: Existing interoperability and MCP checks
        run: python -m pytest -q tests/test_mcp_hardening.py tests/test_interoperability_diagnostics.py

  distribution:
    name: Build and clean-install distribution (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build source distribution and wheel
        run: python -m build
      - name: Validate distribution metadata and files
        run: python scripts/verify_distribution.py
      - name: Validate long description
        run: python -m twine check --strict dist/olyder-0.5.0b1.tar.gz dist/olyder-0.5.0b1-py3-none-any.whl
      - name: Install wheel in fresh environment and smoke it
        shell: bash
        run: |
          python -m venv .wheel-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PY=".wheel-smoke/Scripts/python.exe"
          else
            PY=".wheel-smoke/bin/python"
          fi
          "$PY" -m pip install --no-index --find-links dist "olyder==0.5.0b1"
          "$PY" scripts/smoke_installed.py
      - name: Upload candidate archives for human review
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: olyder-0.5.0b1-build-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 7
