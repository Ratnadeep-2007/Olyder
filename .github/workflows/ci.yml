name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  reusable-verification:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
    with:
      spec-path: examples/demo-app/olyder.json
      allow-exec: true

  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Verify security controls with Olyder
        id: security_controls
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python -m olyder verify --spec olyder.security.json --allow-exec --output "$RUNNER_TEMP/olyder-security"
      - name: Summarize security verification
        if: ${{ !cancelled() && (steps.security_controls.outcome == 'success' || steps.security_controls.outcome == 'failure') }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "olyder-security" / "report.json"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              print("## Olyder security verification\n", file=summary)
              if report_path.is_file():
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  verdict = html.escape(report["status"])
                  print(f"Verdict <code>{verdict}</code>\n", file=summary)
                  for check in report["checks"]:
                      name = html.escape(" ".join(check["id"].split())[:120])
                      status = html.escape(check["status"])
                      print(f"- <code>{name}</code> (<code>{status}</code>)", file=summary)
              else:
                  print("See the verification step log for the error.", file=summary)
          PY
      - name: Upload security verification report
        if: ${{ !cancelled() && (steps.security_controls.outcome == 'success' || steps.security_controls.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: olyder-security-report
          path: ${{ runner.temp }}/olyder-security/report.*
          if-no-files-found: ignore
          retention-days: 7
      - name: CLI help
        run: olyder --help
  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Pull minimal test image
        run: docker pull python:3.13-slim
      - name: Real read-only mount and no-network sandbox tests
        env:
          OLYDER_LIVE_DOCKER: '1'
        run: python -m pytest -q tests/test_docker_live.py

  acp-interop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ACP optional integration
        run: python -m pip install -e '.[acp]' pytest
      - name: Independent SDK/stdio contract tests
        run: python -m pytest -q tests/test_acp_bridge.py
      - name: Existing interoperability and MCP checks
        run: python -m pytest -q tests/test_mcp_hardening.py tests/test_interoperability_diagnostics.py

  distribution:
    name: Build and clean-install distribution (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build source distribution and wheel
        run: python -m build
      - name: Validate distribution metadata and files
        run: python scripts/verify_distribution.py
      - name: Validate long description
        run: python -m twine check --strict dist/olyder-0.5.0b2.tar.gz dist/olyder-0.5.0b2-py3-none-any.whl
      - name: Install wheel in fresh environment and smoke it
        shell: bash
        run: |
          python -m venv .wheel-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PY=".wheel-smoke/Scripts/python.exe"
          else
            PY=".wheel-smoke/bin/python"
          fi
          "$PY" -m pip install --no-index --find-links dist "olyder==0.5.0b2"
          "$PY" scripts/smoke_installed.py
      - name: Upload candidate archives for human review
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: olyder-0.5.0b2-build-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 7
