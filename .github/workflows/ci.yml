name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q
      - name: CLI help
        run: olyder --help
  docker-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Pull minimal test image
        run: docker pull python:3.13-slim
      - name: Real read-only mount and no-network sandbox tests
        env:
          OLYDER_LIVE_DOCKER: '1'
        run: python -m pytest -q tests/test_docker_live.py
