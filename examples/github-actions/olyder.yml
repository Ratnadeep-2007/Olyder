name: Olyder acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Olyder
        run: python -m pip install "git+https://github.com/Ratnadeep-2007/Olyder.git@e51ac79a9662ff7fae00b2265800bcb5497f3b33"
      - name: Verify acceptance criteria
        id: verify
        run: olyder verify --spec olyder.json --output "$RUNNER_TEMP/olyder-report"
      - name: Summarize verification
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "olyder-report" / "report.json"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              print("## Olyder acceptance", file=summary)
              if report.is_file():
                  verdict = json.loads(report.read_text(encoding="utf-8"))
                  metrics = verdict.get("metrics", {})
                  print(f"\n**Verdict:** {verdict['status']}", file=summary)
                  if metrics:
                      print(f"\nExecuted {metrics['executed_checks']} of {metrics['declared_checks']} checks. "
                            f"Passed: {metrics['passed_checks']}. Failed: {metrics['failed_checks']}. "
                            f"Blocked: {metrics['blocked_checks']}.", file=summary)
              else:
                  print("\nVerification produced no report. See the **Verify acceptance criteria** step log.",
                        file=summary)
          PY
      - name: Upload verification report
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: olyder-report
          path: ${{ runner.temp }}/olyder-report/report.*
          if-no-files-found: ignore
          retention-days: 7
